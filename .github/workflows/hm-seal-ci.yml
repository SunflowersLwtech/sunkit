# CI for tools/hm-seal: the encryption core's promises run as tests, offline
# (cargo test --locked after a fetch, then with the network cut), plus clippy.
name: hm-seal CI
on:
  push:
    branches: [main]
    paths: ['tools/hm-seal/**', '.github/workflows/hm-seal-ci.yml']
  pull_request:
    paths: ['tools/hm-seal/**', '.github/workflows/hm-seal-ci.yml']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/hm-seal
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal --component clippy && rustup default stable
      - run: cargo fetch --locked
      - name: Tests with the network cut
        run: sudo unshare --net -- sudo -u "$USER" env PATH="$PATH" HOME="$HOME" cargo test --locked --offline
      - run: cargo clippy --locked --offline --all-targets -- -D warnings

  deny:
    # Advisories, licenses, sources and wildcard versions of the shipped tree
    # (deny.toml). Needs the network: it reads the current RustSec database.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/hm-seal
    steps:
      - uses: actions/checkout@v4
      - name: cargo-deny 0.20.2, release binary checked against its published sha256
        run: |
          curl -sSfL -o "$RUNNER_TEMP/cargo-deny.tgz" https://github.com/EmbarkStudios/cargo-deny/releases/download/0.20.2/cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz
          echo "9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f  $RUNNER_TEMP/cargo-deny.tgz" | sha256sum -c
          tar xzf "$RUNNER_TEMP/cargo-deny.tgz" -C "$RUNNER_TEMP" --strip-components=1 cargo-deny-0.20.2-x86_64-unknown-linux-musl/cargo-deny
      - run: '"$RUNNER_TEMP/cargo-deny" --locked check'
