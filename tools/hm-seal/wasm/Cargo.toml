[package]
name = "hm-seal-wasm"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "WebAssembly binding of hm-seal, for the browser."
publish = false

[lib]
name = "hm_seal"
crate-type = ["cdylib"]

[dependencies]
seal_core = { package = "hm-seal", path = ".." }
# Pinned to the wasm-bindgen CLI that turns the .wasm into JS (README).
wasm-bindgen = "=0.2.130"
js-sys = "0.3"

# On the web target, randomness comes from crypto.getRandomValues and
# OpenMLS reads the clock through web-time: std has neither there.
[target.'cfg(target_arch = "wasm32")'.dependencies]
openmls = { version = "=0.9.2", features = ["js"] }
getrandom = { version = "0.4", features = ["wasm_js"] }
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
