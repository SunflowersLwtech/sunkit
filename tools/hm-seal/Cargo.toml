[package]
name = "hm-seal"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "End-to-end encryption core for a person's own devices: an MLS group (RFC 9420, OpenMLS), media frame keys from it (SFrame, RFC 9605) and a data key for what is stored."
publish = false

[workspace]
members = ["python", "wasm"]

[dependencies]
openmls = "=0.9.2"
openmls_rust_crypto = "=0.6.0"
openmls_basic_credential = "=0.6.0"
openmls_traits = "=0.6.0"
sframe = { version = "=2.1.0", default-features = false, features = ["rust-crypto"] }
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
rand = "0.8"
thiserror = "2"
tls_codec = "0.5"

[features]
# Raw-key and raw-exporter entry points for the known-answer tests; never in a shipped build.
test-support = []

[dev-dependencies]
hm-seal = { path = ".", features = ["test-support"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"

# For the browser: smaller, slower to build (`--profile wasm`).
[profile.wasm]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
