# cc-compactor.toml — what to do with a Claude Code session stopped on a usage limit.
#
# Three actions are scored: wait (等额度), compact (压缩后 --resume), handoff (写交接换人).
# Each gets a penalty in [0, 1] on four dimensions, and
#   J = (timing*P_timing + session*P_session + cost*P_cost + account*P_account) / sum of [weights]
# The lowest J is the recommendation. Every key below is read by cc-compactor.py; a key it doesn't
# know shows up as "config: unknown key ..." under `cc-compactor explain` (and compact refuses unknown
# bucket names).

[general]
default_profile = "balanced"
# A key of [timing.tolerable_wait_min]; `--urgency` overrides it per call.
default_urgency = "normal"
magpie_settings_path = "~/.claude/magpie-settings.json"
# For --route seat: the seat this machine's Claude Code is signed in to (oauthAccount.emailAddress only).
claude_json_path = "~/.claude.json"
state_dir = "~/.cache/cc-compactor"
handoff_relpath = ".claude/handoff/current.md"

[limits]
# Hard bill & safety guardrails (upper bounds on any summary call)
max_byok_input_chars = 18000
# The reply is bounded by the prompt (<1200 words), the input cap and the rate
# limits, not by cutting the model's output short.
max_byok_output_tokens = 32000
byok_timeout_sec = 90
# A transcript written to within this many seconds is a running session's: no splice
live_guard_sec = 120
min_compaction_cooldown_sec = 180
max_compactions_per_hour = 6

[compaction]
# Gateway models tried in order for the summary; with none answering the digest is used alone.
# "always-up" still answers when the seats are out (it may land on GLM when glm-guard opens ZCode).
byok_chain = ["claude-haiku-5-5", "always-up"]
preserve_tail_messages = 10
# Summary plus kept tail; tail records are dropped from the front past this (the last two always stay).
target_post_compact_tokens = 40000
# Expected summary size, for the tail cap above and the cost estimate.
summary_tokens = 3000
# Digest sections and summary instructions kept:
#   user_requests todos files_touched git_state commands errors decisions
preserve_buckets = ["user_requests", "todos", "files_touched", "git_state", "commands", "errors", "decisions"]
# Excerpts left out of what the summary model reads (it gets 18,000 characters, these crowd it):
#   read_results (file contents a Read returned; the file can be read again)
#   passing_test_logs (tool output that only says tests passed)
evict_buckets = ["read_results", "passing_test_logs"]

# ── Seats and pools ───────────────────────────────────────────────────────────

[seats]
# Cards counted as the gateway's Claude seats. The personal Max card (plan "max") is not.
plans = ["team"]
# A seat is full at its cap: the gateway stops giving it work there. Mirror of providers.json on the
# gateway (claude accountCaps 95 for every Team seat on 2026-11-03; the week counts as full at 100).
caps = { "5 hours" = 95, "7 days" = 100 }
window_tokens = 1000000
safe_window_ratio = 0.90

# Per-seat overrides, keyed like accountWindowCaps (the card's user in lower case). They go in each
# machine's own config, not in this file, so the shipped file names no account:
#   [seats.seat_caps."<card user in lower case>"]
#   "5 hours" = 100

# Other gateway pools, by provider name in /v1/magpie/quotas. usable = the gateway falls back to it for
# a resumed session and that model is fine for the work; only then is it room for wait/compact.
# seat_pct_factor: a pool's spend in seat-percent (how scarce it is next to a Claude seat).
[pools.zcode]
window_tokens = 1000000
usable = false
min_remaining_pct = 5
seat_pct_factor = 0.12

[pools.devin]
window_tokens = 1000000
usable = false
min_remaining_pct = 5
seat_pct_factor = 0.22

[pools.grok]
window_tokens = 256000
usable = false
min_remaining_pct = 5
seat_pct_factor = 0.15

# ── The four dimensions ───────────────────────────────────────────────────────

[weights]
timing = 0.30    # 时机: seat/pool reset times, the live guard, urgency
session = 0.25   # 会话: context dropped, raw context near the window, a warm cache thrown away
cost = 0.25      # 成本: seat allowance spent by the resume turn, the turns after, the summary call
account = 0.20   # 账号: that spend against the room left on the seats (5 hours and week)

[timing]
# The wait (minutes) at which the timing penalty is one half: penalty = minutes / (minutes + this).
# From the secretary's rule (limit-migration-judgment): back within half an hour -> wait; an hour
# or more and the work is urgent or long -> hand it to another executor.
tolerable_wait_min = { high = 10, normal = 30, low = 120 }
# Wait assumed when neither seat readings nor the stop message give one (and it counts as a guess).
unknown_wait_min = 60
compact_min = 2
# Minutes until another executor has picked the work up.
handoff_min = 10
w_wait = 0.8
w_uncertain = 0.2

[session]
cache_ttl_sec = 3600
# Below this a summary saves too little to be worth what it drops.
compact_min_tokens = 100000
# Loss of a summary = compact_loss * share of context dropped * (1 - tool_relief * share that is tool output)
compact_loss = 0.6
tool_relief = 0.5
handoff_loss = 0.8
w_loss = 0.6
w_size = 0.25
w_cache = 0.15

[cost]
# Input-equivalent tokens per percent of a seat's 5-hour window (5% was about 1.5M on 2026-10-24).
tokens_per_seat_pct = 300000
cache_write_mult = 2.0
cache_read_mult = 0.1
output_mult = 5.0
# Price of the summary model next to the session's (Haiku against Opus).
compactor_price_factor = 0.2
turns_after_resume = 15
handoff_reread_tokens = 80000
# Seat-percent at which the cost penalty reaches 1.
norm_pct = 20

[account]
w_5h = 0.7
w_7d = 0.3
# Weekly percent one 5-hour percent of a seat uses up (estimate).
pct_7d_per_pct_5h = 0.15
min_headroom_pct = 1
# Room a handoff lands on (another executor or session); 100 = a whole fresh seat.
handoff_headroom_pct = 100

# ── Profiles: deep-merged over [weights] [timing] [session] [cost] [account] [seats] [pools] ──

[profiles.balanced]

[profiles.speed_first.weights]
timing = 0.50
session = 0.20
cost = 0.15
account = 0.15

[profiles.quality_first.weights]
timing = 0.20
session = 0.50
cost = 0.15
account = 0.15

[profiles.seat_saver.weights]
timing = 0.15
session = 0.20
cost = 0.35
account = 0.30
