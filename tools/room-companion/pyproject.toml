[project]
name = "room-companion"
version = "0.1.0"
description = "A camera + microphone room companion with three hard privacy switches, local speech recognition and a local vision model."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
# speech recognition (VAD + SenseVoice) and text-to-speech
speech = ["sherpa-onnx>=1.13", "numpy"]
# motion scoring from JPEG frames (Windows/DirectShow capture)
motion = ["pillow"]
all = ["sherpa-onnx>=1.13", "numpy", "pillow"]
# the HipiMind connector (websockets) and scaling live frames (pillow)
hipimind = ["websockets>=13", "pillow"]
# Bluetooth camera drivers, wherever the Bluetooth adapter is (on Windows: in a Windows venv, not in WSL)
ble = ["bleak>=1.1"]

[project.scripts]
room-companion = "room_companion.__main__:main"
room-companion-hipimind = "room_companion.hipimind:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["room_companion", "room_companion.notifiers", "room_companion.camera"]

[tool.setuptools.package-data]
room_companion = ["winplay.ps1"]
